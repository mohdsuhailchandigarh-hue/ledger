<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Spine Blue Gradient -->
    <linearGradient id="spineBlueLight" x1="96" y1="108" x2="160" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C75FB"/>
      <stop offset="100%" stop-color="#0263DC"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas (Light Mode) -->
  <rect width="512" height="512" rx="124" fill="#FFFFFF"/>
  <rect width="508" height="508" x="2" y="2" rx="122" stroke="rgba(0, 0, 0, 0.06)" stroke-width="2"/>

  <!-- Left Spine (Vibrant Blue, Rounded Left Corners, Flush Top & Bottom) -->
  <path d="
    M 160 108
    L 160 404
    L 128 404
    C 106 404 96 390 96 368
    L 96 144
    C 96 122 106 108 128 108
    Z" fill="url(#spineBlueLight)"/>

  <!-- Main Clean Midnight Navy Book Cover (Rounded Right Corners, Flush with Spine) -->
  <path d="
    M 160 108
    L 384 108
    C 406 108 416 122 416 144
    L 416 368
    C 416 390 406 404 384 404
    L 160 404
    Z" fill="#131824"/>

  <!-- Ledger Grid Lines (Crisp White on Dark Navy Cover) -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Column 1 (Left table border) -->
    <line x1="208" y1="172" x2="208" y2="368"/>
    <!-- Vertical Column 2 (Divider column, square cell with Col 1) -->
    <line x1="244" y1="172" x2="244" y2="368"/>

    <!-- 5 Horizontal Row Lines (Start at Col 1, extend across cover) -->
    <line x1="208" y1="172" x2="378" y2="172"/>
    <line x1="208" y1="208" x2="378" y2="208"/>
    <line x1="208" y1="244" x2="378" y2="244"/>
    <line x1="208" y1="280" x2="378" y2="280"/>
    <line x1="208" y1="316" x2="378" y2="316"/>
  </g>
</svg>
