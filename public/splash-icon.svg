<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Spine Blue Gradient -->
    <linearGradient id="splashSpineBlue" x1="96" y1="108" x2="160" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C75FB"/>
      <stop offset="100%" stop-color="#0263DC"/>
    </linearGradient>

    <!-- Subtle Premium Glow / Shadow for Splash Presentation -->
    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Centered Symbol with Drop Shadow -->
  <g filter="url(#splashGlow)">
    <!-- Left Spine -->
    <path d="
      M 160 108
      L 160 404
      L 128 404
      C 106 404 96 390 96 368
      L 96 144
      C 96 122 106 108 128 108
      Z" fill="url(#splashSpineBlue)"/>

    <!-- Main Clean White Book Cover -->
    <path d="
      M 160 108
      L 384 108
      C 406 108 416 122 416 144
      L 416 368
      C 416 390 406 404 384 404
      L 160 404
      Z" fill="#FFFFFF"/>

    <!-- Ledger Grid Lines -->
    <g stroke="#131722" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <line x1="208" y1="172" x2="208" y2="368"/>
      <line x1="244" y1="172" x2="244" y2="368"/>
      <line x1="208" y1="172" x2="378" y2="172"/>
      <line x1="208" y1="208" x2="378" y2="208"/>
      <line x1="208" y1="244" x2="378" y2="244"/>
      <line x1="208" y1="280" x2="378" y2="280"/>
      <line x1="208" y1="316" x2="378" y2="316"/>
    </g>
  </g>
</svg>
